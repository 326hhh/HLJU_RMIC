%YAML:1.0
---
# ============================================================
# 反小陀螺（旋转机器人目标跟踪）参数（27RM）
#
# 模型：敌方机器人 4 块装甲板排成环形，绕竖直轴旋转。
# 从 1~2 块板的观测反推机器人中心/半径/相位/转速，并预测未来板位置。
# ============================================================
radius_mm: 150.0          # 机器人中心到板面中心的水平距离（实测！）
                          # 拿卷尺量机器人中心到装甲板板面中心的水平距离
armor_num: 4              # 装甲板数量（校内赛 4 块）
predict_time_s: 0.04      # 预测前瞻（补偿处理/击发延迟，秒）
max_spin_rate_dps: 900.0  # 最大转速（°/s，用于钳制）
center_accel_std: 40.0    # 中心平动加速度噪声（mm/s²，越大越跟手）
phase_accel_std_deg: 120.0  # 相位角加速度噪声（°/s²）
center_meas_std_mm: 12.0  # 中心位置观测噪声（mm）
phase_meas_std_deg: 3.0   # 相位观测噪声（°）
assoc_gate_mm: 400.0      # 观测与预测板位置的关联门限（mm）
estimate_radius: 1        # 同时看到 2 块板时在线估计半径
